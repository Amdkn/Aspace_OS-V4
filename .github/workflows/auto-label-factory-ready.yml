name: "Auto-label factory:ready"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  autolabel:
    # Opt-in explicite requis a la creation; les issues ordinaires ne sont PAS automatiquement soumises a Jules.\n    # Cette modification ne supprime pas les labels ni les receipts des missions deja existantes.
    if: ${{ contains(github.event.issue.labels.*.name, 'factory:opt-in') && !contains(github.event.issue.labels.*.name, 'no-factory') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add factory:ready label
        env:
          # Si le secret LABEL_PAT existe (PAT personnel), le label est pose avec :
          # l'evenement `labeled` declenche alors le factory INSTANTANEMENT.
          # Regle anti-boucle GitHub : un label pose avec GITHUB_TOKEN ne declenche jamais de workflow.
          # Sans LABEL_PAT : repli sur GITHUB_TOKEN, label pose, dispatch au prochain cron (<=30 min).
          GH_TOKEN: ${{ secrets.LABEL_PAT != '' && secrets.LABEL_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --add-label "factory:ready" \
            --repo "${{ github.repository }}"
