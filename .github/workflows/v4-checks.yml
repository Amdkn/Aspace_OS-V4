name: V4 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prevent technical PR auto-link to Life acceptance issues
        if: github.event_name == 'pull_request'
        run: python tools/pr_life_status_guard.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/holon_route.py --cases
      - run: python -m unittest -v
        working-directory: portable
      - run: python tools/memory.py check --root 40_Memory
      - run: python tools/continuity_canary.py

      - name: Qualify Bill–Tilly Factory capability without execution
        run: python tools/factory_qualify.py --out factory-out
      - name: Cold-start handoff capsule from durable receipt
        run: python tools/handoff_compiler.py factory-out/handoff.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bill-tilly-factory-qualification-${{ runner.os }}
          path: factory-out/
          retention-days: 30

  independent-factory-replay:
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Linux handoff artifact without A0 copy/paste
        uses: actions/download-artifact@v4
        with:
          name: bill-tilly-factory-qualification-Linux
          path: imported-qualification/
      - name: Verify independently checked-out source and imported receipt
        run: python tools/factory_resume.py imported-qualification/qualification.json imported-qualification/handoff.json --out replay-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bill-tilly-independent-replay
          path: replay-out/
          retention-days: 30
