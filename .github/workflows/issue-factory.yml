name: Aspace Issue Factory
on:
  issues:
    types: [labeled]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number; empty reconciles the ready queue'
        type: string
        required: false
      recover_session:
        description: 'Existing Jules sessions/id after ambiguous dispatch; explicit issue required'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: aspace-issue-factory
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'issues' || github.event.label.name == 'factory:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Dispatch build or reconcile existing session
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FACTORY_ISSUE: ${{ inputs.issue }}
          RECOVER_SESSION: ${{ inputs.recover_session }}
        run: python tools/issue_factory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-factory-receipt
          path: factory-out/
          retention-days: 90
