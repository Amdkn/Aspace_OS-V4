es relatives), BMAD, gstack, CEO Bench, Prime Agent, DeepSeek Harness, OpenClaw/Hermes, WATCH, OpenWiki/LLM Wiki/DOX, les surfaces Agent/Life/Business/Mobile OS, CubeFarm, Starnet et WorkAdventure. Les 75 services OMK restent d\xE9clar\xE9s, \xE0 qualifier individuellement.</p></details><details><summary>Inventaire et niveaux de preuve</summary><table><tr><th>Disposition V3</th><th>Entr\xE9es</th><th>Ce que cela prouve</th></tr><tr><td>Sources historiques import\xE9es</td><td>1 341</td><td>Contenu, provenance et empreintes pr\xE9serv\xE9s</td></tr><tr><td>Archives r\xE9f\xE9renc\xE9es</td><td>3 249</td><td>Origine conserv\xE9e ; contenu non transf\xE9r\xE9 en bloc</td></tr><tr><td>\xC0 qualifier</td><td>4 736</td><td>Pr\xE9sence dans l\u2019inventaire ; pas une certification</td></tr><tr><td>Binaires r\xE9f\xE9renc\xE9s</td><td>7</td><td>R\xE9f\xE9rences conserv\xE9es</td></tr><tr><td>Gitlinks externes</td><td>6</td><td>Origines \xE0 r\xE9soudre</td></tr></table><p>45 tests principaux + 6 tests portables passants ; CI GitHub verte au contr\xF4le pr\xE9c\xE9dent. Le canary SQLite valide une reprise isol\xE9e avec d\xE9duplication. Il ne prouve ni une migration entre deux VPS, ni une flotte active, ni une connexion GWS.</p></details><details><summary>Sources et fabrication</summary><p><a href="https://github.com/Amdkn/Aspace_OS-V4/pull/8">PR #8</a> \xB7 <a href="https://github.com/Amdkn/Aspace_OS-V4/actions/runs/37354690805">CI contr\xF4l\xE9e</a> \xB7 <a href="https://github.com/Amdkn/Aspace_OS_V3/tree/ad5e68e2867854ad952495cf1fcd37d76acbd33e">Snapshot V3</a>.</p><p>Rendu : <a href="https://github.com/alexgreensh/anidoodle">Anidoodle</a>, Alex Greenshpun, Apache-2.0, commit f649db6. Chor\xE9graphie adapt\xE9e : <a href="https://github.com/moguzbulbul/blueprint-animation">Blueprint Animation</a> 1.3.1, O\u011Fuz, commit 29aa30b, <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>. Adaptation Canvas des phases ; pas d\u2019utilisation du moteur C
