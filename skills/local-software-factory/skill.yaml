  rationale: 'The current skill teaches mandatory human gates and a worker that never merges, which contradicts the standing no-human-gate doctrine where authority replaces the gate and work never executes without design sign-off. The evidence window shows the failure mode the old text leaves unhandled: the BedRock pulse of 2026-10-13 reported 43 additional Issue Factory failures across runs 283 to 325, a blocked issue open since 9 October, and a prepared pause D-N027 that was neither applied nor journaled. The update replaces the human gate with a design-authority gate and adds the missing blocked-loop rule: stop, apply a reversible journaled pause, and route to design authority instead of redispatching. The deterministic handoff-suppression candidates were rejected because they concern scheduler policy, not a skill, and the bare tool-failure list carries no error detail that would ground a skill change.'
